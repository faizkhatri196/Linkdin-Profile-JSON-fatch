services:
  - type: web
    name: linkedin-profile-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "30"
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: SCRAPER_TIMEOUT_MS
        value: "15000"
